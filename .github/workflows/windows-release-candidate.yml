name: Windows release candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-release-candidate.yml
      - installer/**
      - tools/build_windows_installer.ps1
      - tools/package_windows.ps1
      - tools/test_windows_installer_upgrade.ps1
      - tools/verify_windows_release.ps1
      - tools/verify_windows_signatures.ps1
      - tools/write_release_checksums.ps1
      - pubspec.yaml

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release-candidate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Verify Windows release
        shell: pwsh
        run: >-
          .\tools\verify_windows_release.ps1
          -ReleaseDirectory .\build\windows\x64\runner\Release
          -ExpectedVersion 1.9.1+15

      - name: Validate PowerShell release tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            '.\tools\build_windows_installer.ps1',
            '.\tools\package_windows.ps1',
            '.\tools\test_windows_installer_upgrade.ps1',
            '.\tools\verify_windows_lifecycle_evidence.ps1',
            '.\tools\verify_windows_release.ps1',
            '.\tools\verify_windows_signatures.ps1',
            '.\tools\windows_lifecycle_evidence.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw "$file contains a PowerShell parse error: $($errors[0].Message)"
            }
          }

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'inno-setup-6.7.3'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash
          $expected = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
          if ($actual -ne $expected) {
            throw 'Inno Setup installer SHA-256 mismatch.'
          }
          $arguments = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            ('/DIR="{0}"' -f $destination)
          )
          $process = Start-Process -FilePath $download -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }
          $compiler = Join-Path $destination 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw 'Inno Setup compiler was not installed.'
          }
          "CLASHXY_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package portable archive
        shell: pwsh
        run: .\tools\package_windows.ps1 -SkipBuild

      - name: Build installer
        shell: pwsh
        run: .\tools\build_windows_installer.ps1 -SkipBuild -Iscc $env:CLASHXY_ISCC

      - name: Verify installer install and uninstall
        shell: pwsh
        run: .\tools\test_windows_installer_upgrade.ps1 -InstallOnly

      - name: Write checksums
        shell: pwsh
        run: .\tools\write_release_checksums.ps1

      - name: Attest release candidate provenance
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS-1.9.1-build15.txt

      - name: Upload release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ClashXY-Windows-x64-1.9.1-build15
          path: |
            dist/ClashXY-Windows-x64-1.9.1-build15.zip
            dist/ClashXY-Setup-x64-1.9.1-build15.exe
            dist/SHA256SUMS-1.9.1-build15.txt
          if-no-files-found: error
          retention-days: 14
